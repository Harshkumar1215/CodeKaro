<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>कक्षा 10 बिहार बोर्ड MCQ अभ्यास मंच | Class 10 BSEB MCQ Practice Platform</title>
  <meta name="description" content="Class 10 Bihar Board (BSEB) MCQ Practice Platform with complete syllabus coverage in Hindi and English medium. Practice Mathematics, Science, Social Science, Hindi, English and Sanskrit.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ====== HEADER ====== -->
  <header class="glass">
    <div class="header-container">

      <!-- Logo -->
      <div class="logo-wrapper" onclick="App.goHome()">
        <div class="logo-icon">📖</div>
        <div>
          <div class="logo-title">BSEB MCQ</div>
          <div class="logo-subtitle">Class 10 Bihar Board</div>
        </div>
      </div>

      <!-- Desktop Navigation -->
      <nav class="desktop-nav" id="main-nav">
        <span class="nav-link active" data-view="home" onclick="App.goHome()">🏠 <span class="nav-text">Home</span></span>
        <span class="nav-link" data-view="dashboard" onclick="App.showView('dashboard')">📊 <span class="nav-text">Dashboard</span></span>
        <span class="nav-link" data-view="analytics" onclick="App.showView('analytics')">📈 <span class="nav-text">Analytics</span></span>
        <span class="nav-link" data-view="recommendations" onclick="App.showView('recommendations')">🎯 <span class="nav-text">Suggest</span></span>
        <span class="nav-link" data-view="history" onclick="App.showView('history')">📋 <span class="nav-text">History</span></span>
        <span class="nav-link" data-view="search" onclick="App.showView('search')">🔍 <span class="nav-text">Search</span></span>
      </nav>

      <!-- Language Switcher -->
      <div class="lang-switch-wrapper">
        <button class="lang-btn medium-btn active" data-lang="hi" onclick="App.setLanguage('hi')">हिंदी</button>
        <button class="lang-btn medium-btn" data-lang="en" onclick="App.setLanguage('en')">English</button>
      </div>
    </div>
  </header>

  <!-- ====== MAIN CONTENT ====== -->
  <main id="main-content" style="flex:1;">
    <!-- Dynamic content rendered here by App.js -->
    <div style="text-align:center;padding:3rem;color:var(--text-muted);">Loading...</div>
  </main>

  <!-- ====== BOTTOM MOBILE NAVIGATION BAR ====== -->
  <nav class="bottom-nav glass" id="bottom-nav">
    <button class="bottom-nav-item active" data-view="home" onclick="App.goHome()" aria-label="Home">
      <span class="bottom-nav-icon">🏠</span>
      <span class="bottom-nav-label" data-i18n-hi="होम" data-i18n-en="Home">होम</span>
    </button>
    <button class="bottom-nav-item" data-view="dashboard" onclick="App.showView('dashboard')" aria-label="Dashboard">
      <span class="bottom-nav-icon">📊</span>
      <span class="bottom-nav-label" data-i18n-hi="डैशबोर्ड" data-i18n-en="Stats">डैशबोर्ड</span>
    </button>
    <button class="bottom-nav-item" data-view="analytics" onclick="App.showView('analytics')" aria-label="Analytics">
      <span class="bottom-nav-icon">📈</span>
      <span class="bottom-nav-label" data-i18n-hi="विश्लेषण" data-i18n-en="Analytics">विश्लेषण</span>
    </button>
    <button class="bottom-nav-item" data-view="recommendations" onclick="App.showView('recommendations')" aria-label="Recommendations">
      <span class="bottom-nav-icon">🎯</span>
      <span class="bottom-nav-label" data-i18n-hi="सुझाव" data-i18n-en="Suggest">सुझाव</span>
    </button>
    <button class="bottom-nav-item" data-view="history" onclick="App.showView('history')" aria-label="History">
      <span class="bottom-nav-icon">📋</span>
      <span class="bottom-nav-label" data-i18n-hi="इतिहास" data-i18n-en="History">इतिहास</span>
    </button>
    <button class="bottom-nav-item" data-view="search" onclick="App.showView('search')" aria-label="Search">
      <span class="bottom-nav-icon">🔍</span>
      <span class="bottom-nav-label" data-i18n-hi="खोजें" data-i18n-en="Search">खोजें</span>
    </button>
  </nav>

  <!-- ====== MODAL CONTAINER ====== -->
  <div id="modal-container"></div>

  <!-- ====== FOOTER ====== -->
  <footer class="app-footer">
    <p>बिहार विद्यालय परीक्षा समिति (BSEB) — कक्षा 10 MCQ अभ्यास मंच</p>
    <p style="margin-top:0.25rem;">Bihar Board Class 10 MCQ Practice Platform &mdash; Hindi + English Medium</p>
  </footer>

  <!-- ====== SCRIPTS (order matters: data → engines → UI → app) ====== -->
  <script src="js/data/syllabus.js"></script>
  <script src="js/data/questionBank.js"></script>
  <script src="js/data/questionBankExtra.js"></script>
  <script>
    // Merge all question bank files into one central array at runtime
    if (window.BSEB_QUESTION_BANK_EXTRA && Array.isArray(window.BSEB_QUESTION_BANK_EXTRA)) {
      window.BSEB_QUESTION_BANK = window.BSEB_QUESTION_BANK.concat(window.BSEB_QUESTION_BANK_EXTRA);
    }
  </script>
  <script src="js/engine/questionBankEngine.js"></script>
  <script src="js/engine/dynamicQuestionGenerator.js"></script>
  <script src="js/engine/testEngine.js"></script>
  <script src="js/engine/analyticsEngine.js"></script>
  <script src="js/ui/components.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
