<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CODEKARO - Student Practice Area. Enter your name to begin MCQ practice.">
  <title>CODEKARO | MCQ Practice</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="login-page-body">

  <div class="login-center-wrapper">
    <!-- Clean Brand Header -->
    <header class="login-brand-header">
      <div class="login-brand-logo">
        <div class="brand-icon">⚡</div>
        <h1 class="login-brand-title">CODEKARO</h1>
      </div>
      <p class="login-brand-subtitle">MCQ PRACTICE AREA</p>
    </header>

    <!-- Student Name Entry Card (Simple & Focused) -->
    <main class="login-card">
      <h2 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 0.75rem; color: var(--text-primary);">Enter Your Name</h2>

      <form id="login-form" class="name-form" novalidate>
        <div class="input-group">
          <input type="text" id="student-name-input" class="form-input" placeholder="Enter your name" autocomplete="name" required autofocus>
          <div id="name-error-msg" class="input-error-msg"></div>
        </div>
        <button type="submit" id="enter-btn" class="btn btn-primary btn-block">ENTER</button>
      </form>
    </main>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
